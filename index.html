<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salario neto · Calculadora bruto → neto</title>
    <meta
      name="description"
      content="Calcula tu salario neto mensual a partir del bruto anual. Desglose de Seguridad Social e IRPF. Cálculo aproximado."
    />
    <script>
      // Set the saved theme before first paint to avoid a flash of the wrong one.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
